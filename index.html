<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controla Fácil</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Cabeçalho (visível mais no mobile, pode ser ajustado no desktop) -->
        <header class="app-header">
            <h1>Controla Fácil</h1>
            <p>Organize suas finanças facilmente!</p>
        </header>

        <main class="dashboard-main">
            <!-- Resumo Financeiro / Cards -->
            <section class="summary-cards">
                <div class="card balance-card">
                    <div class="card-icon">🐷</div>
                    <div class="card-info">
                        <h3>Porco</h3>
                        <p id="total-balance" class="value positive">R$ 50,00</p>
                        <span class="label">Saldo</span>
                    </div>
                </div>
                <div class="card income-card">
                    <div class="card-icon income-icon">💲</div>
                    <div class="card-info">
                        <p id="total-income" class="value positive">R$ 60,00</p>
                        <span class="label">Receita</span>
                    </div>
                </div>
                <div class="card expense-card">
                    <div class="card-icon expense-icon">💳</div>
                    <div class="card-info">
                        <p id="total-expense" class="value negative">R$ 10,00</p>
                        <span class="label">Despesa</span>
                    </div>
                </div>
            </section>

            <div class="dashboard-content">
                <!-- Formulário de Nova Transação -->
                <section class="transaction-form-section">
                    <h2>Nova Transação</h2>
                    <form id="transaction-form">
                        <div class="form-group">
                            <label for="amount">Valor (R$)</label>
                            <input type="number" id="amount" placeholder="R$" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <input type="text" id="description" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="type">Tipo</label>
                                <select id="type" required>
                                    <option value="Entrada">Receita / Entrada</option>
                                    <option value="Despesa">Despesa / Saída</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="date">Data</label>
                                <input type="date" id="date" required>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-add">Add</button>
                        </div>
                    </form>
                </section>

                <!-- Histórico de Transações -->
                <section class="transaction-history">
                    <div class="history-header">
                        <h2>Histórico de Transações</h2>
                        <button class="btn-filter" title="Filtrar por Data">Filtro</button>
                    </div>
                    <div class="table-responsive">
                        <table id="transactions-table">
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Tipo</th>
                                    <th>Valor</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-list">
                                <!-- Os itens serão renderizados aqui pelo DOM -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
